name: Content Factory Cron

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Run automation cron
        run: |
          curl -X POST "${{ secrets.APP_URL }}/api/cron/process" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -f
